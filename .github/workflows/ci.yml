name: CI

on:
  push:
  pull_request:

jobs:
  # Fast tests: generator, validation, aggregation and streaming scenarios (local Spark, no Docker)
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pip install pyspark==3.5.3 pytest==8.3.3
      - name: Run unit + integration tests
        env:
          TZ: UTC
        run: pytest tests/unit tests/integration -v

  # Full pipeline in Docker, then end-to-end tests against it
  end-to-end:
    runs-on: ubuntu-latest
    needs: unit-and-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create .env from the example (CI-only password)
        run: |
          cp .env.example .env
          sed -i "s/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)/" .env
      - name: Start the stack
        run: docker compose up -d --build
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run end-to-end tests
        run: pytest tests/e2e -v -m "not slow"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
